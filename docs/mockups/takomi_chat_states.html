<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Takomi Chat UI States</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appBg: 'var(--app-bg)',
            appPanel: 'var(--app-panel)',
            appBorder: 'var(--app-border)',
            appHover: 'var(--app-hover)',
            appText: 'var(--app-text)',
            appMuted: 'var(--app-muted)',
            appItemBg: 'var(--app-item-bg)',
            appTerminalBg: 'var(--app-terminal-bg)',
            appTerminalHeader: 'var(--app-terminal-header)',
            takomiBlue: '#3B82F6',
            takomiFocus: '#2563EB',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --app-bg: #FFFFFF;
      --app-panel: #F4F4F5;
      --app-border: #E4E4E7;
      --app-hover: #F4F4F5;
      --app-text: #09090B;
      --app-muted: #71717A;
      --app-item-bg: #F4F4F5;
      --app-terminal-bg: #F8F8F8;
      --app-terminal-header: #E4E4E7;
    }
    
    .dark {
      --app-bg: #0E0E10;
      --app-panel: #141416;
      --app-border: #27272A;
      --app-hover: #1F1F22;
      --app-text: #EDEDED;
      --app-muted: #A1A1AA;
      --app-item-bg: #27272A;
      --app-terminal-bg: #0C0C0D;
      --app-terminal-header: #121214;
    }
    
    body { font-family: 'Inter', sans-serif; background-color: var(--app-bg); color: var(--app-text); transition: background-color 0.3s, color 0.3s; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: var(--app-border); border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: var(--app-muted); }
    
    .markdown-content p { margin-bottom: 0.75rem; line-height: 1.6; }
    .markdown-content p:last-child { margin-bottom: 0; }
    .markdown-content code:not(pre code) { 
      background: var(--app-item-bg); 
      padding: 0.125rem 0.375rem; 
      border-radius: 0.25rem; 
      font-family: 'JetBrains Mono', monospace; 
      font-size: 0.85em; 
    }
    
    .loading-dots:after {
      content: '.';
      animation: dots 1.5s steps(5, end) infinite;
    }
    @keyframes dots {
      0%, 20% { color: transparent; text-shadow: .25em 0 0 transparent, .5em 0 0 transparent;}
      40% { color: inherit; text-shadow: .25em 0 0 transparent, .5em 0 0 transparent;}
      60% { text-shadow: .25em 0 0 inherit, .5em 0 0 transparent;}
      80%, 100% { text-shadow: .25em 0 0 inherit, .5em 0 0 inherit;}
    }

    [data-state-btn].active {
      background-color: var(--app-border);
      color: var(--app-text);
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden text-sm selection:bg-takomiFocus/30">

  <!-- Sidebar -->
  <div class="w-64 bg-appPanel border-r border-appBorder flex flex-col z-50 overflow-y-auto shrink-0 custom-scrollbar">
    <div class="p-4 border-b border-appBorder font-medium flex items-center gap-2 sticky top-0 bg-appPanel/90 backdrop-blur z-10">
      <i data-lucide="layout" class="w-4 h-4 text-takomiBlue"></i>
      State Mockups
    </div>
    <div id="state-list" class="flex flex-col p-2 gap-0.5 text-[13px] text-appMuted">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Main View -->
  <div class="flex-1 flex flex-col relative h-full bg-appBg overflow-hidden">
    
    <!-- Top Header -->
    <header class="h-12 flex items-center justify-between px-4 border-b border-appBorder bg-appBg/80 backdrop-blur-md z-10 shrink-0">
      <div class="flex items-center gap-2">
        <i data-lucide="folder" class="w-4 h-4 text-appMuted"></i>
        <span class="font-medium" id="header-workspace-name">Takomi_Code</span>
        <i data-lucide="chevron-down" class="w-3 h-3 text-appMuted opacity-50"></i>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2" id="header-status">
          <!-- JS rendered -->
        </div>
        <div class="h-4 w-px bg-appBorder"></div>
        <button id="theme-toggle" class="p-1.5 rounded-md hover:bg-appHover text-appMuted transition-colors" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
      </div>
    </header>

    <!-- Transcript / Narrative Surface -->
    <main class="flex-1 overflow-y-auto w-full custom-scrollbar relative" id="transcript-scroll">
      <div class="max-w-[48rem] mx-auto py-8 px-4 flex flex-col gap-8 pb-24" id="transcript-container">
        <!-- Messages rendered here -->
      </div>
    </main>

    <!-- Bottom Ticker & Composer -->
    <div class="w-full absolute flex flex-col items-center bottom-0 left-0 right-0 pointer-events-none">
      
      <!-- Gradient Fade to make text readable behind composer -->
      <div class="w-full h-32 bg-gradient-to-t from-appBg via-appBg/90 to-transparent absolute bottom-0 left-0 right-0 -z-10"></div>
      
      <div class="w-full max-w-[48rem] px-4 pb-6 flex flex-col gap-2 pointer-events-auto relative mt-auto">
        
        <!-- Bottom Ticker -->
        <div id="bottom-ticker-container" class="h-6 flex items-center justify-center transition-all duration-300 transform translate-y-2 opacity-0 text-[12px] mono text-appMuted hidden">
          <!-- JS rendered -->
        </div>

        <!-- Composer -->
        <div class="bg-appPanel border border-appBorder rounded-[1.25rem] shadow-2xl focus-within:border-takomiBlue/50 transition-colors flex flex-col">
          
          <div id="composer-attachments" class="px-4 pt-3 flex gap-2 flex-wrap items-center empty:hidden">
            <!-- JS rendered attachments -->
          </div>
          
          <div class="relative flex items-end">
            <textarea id="composer-input" rows="1" class="w-full bg-transparent border-none text-appText px-4 py-3.5 focus:outline-none resize-none max-h-48 custom-scrollbar placeholder:text-appMuted/60" placeholder="Ask Takomi..."></textarea>
            <div class="p-2 pr-3 flex items-center gap-2 shrink-0 mb-0.5" id="composer-actions">
              <!-- JS rendered -->
            </div>
          </div>
          
          <div class="px-3 py-2 flex items-center justify-between">
            <div class="flex items-center gap-0.5">
              <button class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 text-appMuted transition-colors" title="Attach context">
                <i data-lucide="paperclip" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
        
        <div class="text-center text-[11px] text-appMuted/50 mt-1">
          Takomi runtime state mockup
        </div>
      </div>
    </div>
  </div>

  <!-- State Data & Rendering Script -->
  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    const states = [
      {
        id: 'idle',
        name: '1. Idle, empty draft',
        header: { name: 'Takomi_Code', statusText: 'Workspace ready', active: false },
        transcript: [],
        ticker: null,
        composer: { text: '', placeholder: 'Ask Takomi...', mode: 'send' }
      },
      {
        id: 'draft',
        name: '2. Draft ready to send',
        header: { name: 'Takomi_Code', statusText: 'Workspace ready', active: false },
        transcript: [],
        ticker: null,
        attachments: [ { name: 'codex_sdk_state_map.md', size: '2 KB', icon: 'file-text' } ],
        composer: { text: 'Refine this state map into a mini design spec.', placeholder: 'Ask Takomi...', mode: 'send' }
      },
      {
        id: 'starting',
        name: '3. Starting run',
        header: { name: 'Takomi_Code', statusText: '1 run active in this workspace', active: true },
        transcript: [
          { role: 'user', content: 'Scan the project files and map the current architecture.' }
        ],
        ticker: 'Starting run...',
        composer: { text: '', placeholder: 'Takomi is running...', mode: 'stop' }
      },
      {
        id: 'thinking',
        name: '4. Running with thinking/reasoning',
        header: { name: 'Takomi_Code', statusText: '1 run active in this workspace', active: true },
        transcript: [
          { role: 'user', content: 'What is the best way to handle auth here?' },
          { role: 'assistant', completed: false, parts: [
            { type: 'thought', status: 'in_progress', text: 'To determine the best auth strategy, I should review the existing middleware... We could use JWT tokens or session cookies. Since the frontend is SPA, JWT is common. Let me outline the pros and cons.' }
          ]}
        ],
        ticker: null,
        composer: { text: '', placeholder: 'Takomi is running...', mode: 'stop' }
      },
      {
        id: 'command',
        name: '5. Running with command execution',
        header: { name: 'Takomi_Code', statusText: '1 run active in this workspace', active: true },
        transcript: [
          { role: 'user', content: 'Run the tests for the login component.' },
          { role: 'assistant', completed: false, parts: [
            { type: 'command', status: 'in_progress', command: 'npm test -- src/components/Login.test.tsx', logs: '> jest\nPASS src/components/Login.test.tsx\n  Login\n    ✓ renders correctly\n\nTest Suites: 1 passed, 1 total\nTime: 1.2s' }
          ]}
        ],
        ticker: 'Running command tests...',
        composer: { text: '', placeholder: 'Takomi is running...', mode: 'stop' }
      },
      {
        id: 'file_change',
        name: '6. Running with file changes',
        header: { name: 'Takomi_Code', statusText: '1 run active in this workspace', active: true },
        transcript: [
          { role: 'user', content: 'Update the main CSS file to use dark mode variables.' },
          { role: 'assistant', completed: false, parts: [
            { type: 'file_change', status: 'completed', files: ['src/styles/globals.css', 'tailwind.config.js'] }
          ]}
        ],
        ticker: 'Applying modifications to 2 files...',
        composer: { text: '', placeholder: 'Takomi is running...', mode: 'stop' }
      },
      {
        id: 'interleaved',
        name: '7. Interleaved stream & tools',
        header: { name: 'Takomi_Code', statusText: '1 run active in this workspace', active: true },
        transcript: [
          { role: 'user', content: 'Find why the build fails and fix it.' },
          { role: 'assistant', completed: false, parts: [
            { type: 'text', content: 'I will run the build command to inspect the error.' },
            { type: 'command', status: 'completed', command: 'npm run build', logs: 'Error: Cannot find module "uuid" in src/utils.ts' },
            { type: 'text', content: 'It seems the `uuid` module is not installed. I will install it and update the import.' },
            { type: 'command', status: 'completed', command: 'npm install uuid @types/uuid', logs: 'added 2 packages, and audited 153 packages in 2s' },
            { type: 'file_change', status: 'completed', files: ['package.json'] },
            { type: 'text', content: 'Now the build should ', streaming: true }
          ]}
        ],
        ticker: 'Generating text response...',
        composer: { text: '', placeholder: 'Takomi is running...', mode: 'stop' }
      },
      {
        id: 'completed',
        name: '8. Completed successfully',
        header: { name: 'Takomi_Code', statusText: 'Workspace ready', active: false },
        transcript: [
          { role: 'user', content: 'Switch all instances of class to className in the header.' },
          { role: 'assistant', completed: true, parts: [
            { type: 'file_change', status: 'completed', files: ['src/components/Header.tsx', 'src/components/Footer.tsx'] },
            { type: 'text', content: 'I have updated the `class` attributes to `className` in the React components.' }
          ]}
        ],
        ticker: null,
        composer: { text: '', placeholder: 'Ask Takomi...', mode: 'send' }
      },
      {
        id: 'failed',
        name: '9. Failed',
        header: { name: 'Takomi_Code', statusText: 'Workspace ready', active: false },
        transcript: [
          { role: 'user', content: 'Fetch the latest logs from the remote server.' },
          { role: 'assistant', completed: false, error: true, parts: [
            { type: 'command', status: 'failed', command: 'ssh user@prod "cat /var/log/syslog"', logs: 'ssh: connect to host prod port 22: Connection refused' }
          ]}
        ],
        ticker: null,
        composer: { text: '', placeholder: 'Ask Takomi...', mode: 'send' }
      },
      {
        id: 'cancelled',
        name: '10. Cancelled',
        header: { name: 'Takomi_Code', statusText: 'Workspace ready', active: false },
        transcript: [
          { role: 'user', content: 'Write a massive unit test suite for the entire app.' },
          { role: 'assistant', completed: false, cancelled: true, parts: [
            { type: 'text', content: 'I will begin creating the tests by looking at `src/`...' },
            { type: 'file_change', status: 'completed', files: ['src/App.test.tsx'] }
          ]}
        ],
        ticker: null,
        composer: { text: '', placeholder: 'Ask Takomi...', mode: 'send' }
      },
      {
        id: 'paused',
        name: '11. Paused/resumable',
        header: { name: 'Takomi_Code', statusText: '1 paused run in this workspace', active: false, paused: true },
        transcript: [
          { role: 'user', content: 'Deploy the database migrations to production.' },
          { role: 'assistant', completed: false, paused: true, parts: [
            { type: 'command', status: 'completed', command: 'npx prisma generate', logs: 'Prisma Client generated successfully.' },
            { type: 'text', content: 'The client is ready. I need your confirmation before running the `migrate deploy` command against the production URI.' },
            { type: 'pause_request', text: 'Waiting for approval to run command: npx prisma migrate deploy' }
          ]}
        ],
        ticker: 'Run paused waiting for approval',
        composer: { text: '', placeholder: 'Run is paused. Resume to continue...', mode: 'resume' }
      },
      {
        id: 'long-running',
        name: '12. Long-running job',
        header: { name: 'Takomi_Code', statusText: '1 run active in this workspace', active: true },
        transcript: [
          { role: 'user', content: 'Compress all video assets in the public folder.' },
          { role: 'assistant', completed: false, parts: [
            { type: 'command', status: 'in_progress', command: 'ffmpeg -i input.mp4 -vcodec libx265 -crf 28 output.mp4', timeElapsed: '10m 40s', logs: 'frame=4520 fps=15 q=29.0 size= 12800kB time=00:03:00.80 bitrate= 579.8kbits/s speed=0.6x' }
          ]}
        ],
        ticker: 'Compressing video assets...',
        composer: { text: '', placeholder: 'Takomi is running...', mode: 'stop' }
      },
      {
        id: 'media',
        name: '13. Message with image/file attachments',
        header: { name: 'Takomi_Code', statusText: 'Workspace ready', active: false },
        transcript: [
          { role: 'user', content: 'Update the hero banner to use this new background image and change the headline text to what is in the word doc.', attachments: [
            { type: 'image', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=300&h=200&fit=crop' },
            { type: 'file', icon: 'file-text', name: 'CopyDraft_v2.docx', size: '14 KB' }
          ] },
          { role: 'assistant', completed: true, parts: [
            { type: 'text', content: 'I have updated the `Hero` component background and extracted the headline from the document.' },
            { type: 'file_change', status: 'completed', files: ['src/components/Hero.tsx', 'public/images/bg.jpg'] }
          ]}
        ],
        ticker: null,
        composer: { text: '', placeholder: 'Ask Takomi...', mode: 'send' }
      },
      {
        id: 'dense',
        name: '14. Dense technical answer',
        header: { name: 'Takomi_Code', statusText: 'Workspace ready', active: false },
        transcript: [
          { role: 'user', content: 'How does the routing layer in `src/app/api` handle auth callbacks?' },
          { role: 'assistant', completed: true, parts: [
            { type: 'text', content: 'The authentication callback flow is handled through Next.js route handlers. When the OAuth provider redirects to `src/app/api/auth/callback/route.ts`, it processes the `code` parameter.' },
            { type: 'file_change', status: 'completed', files: ['src/app/api/auth/callback/route.ts'] },
            { type: 'code', language: 'typescript', code: 'import { NextResponse } from "next/server";\nimport { verifyToken } from "@/lib/auth";\n\nexport async function GET(req: Request) {\n  const url = new URL(req.url);\n  const code = url.searchParams.get("code");\n\n  if (!code) {\n    return NextResponse.redirect("/login?error=missing_code");\n  }\n\n  const session = await verifyToken(code);\n  return NextResponse.redirect("/dashboard");\n}' },
            { type: 'text', content: 'The token verified by `src/lib/auth.ts` is then persisted in secure HTTP-only cookies before the final redirect to the dashboard.' }
          ]}
        ],
        ticker: null,
        composer: { text: '', placeholder: 'Ask Takomi...', mode: 'send' }
      }
    ];

    function renderState(stateId) {
      const state = states.find(s => s.id === stateId);
      if (!state) return;

      // Update sidebar active state
      document.querySelectorAll('[data-state-btn]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.stateBtn === stateId);
      });

      // Render Header
      document.getElementById('header-workspace-name').textContent = state.header.name;
      const statusColor = state.header.paused ? 'bg-orange-500' : (state.header.active ? 'bg-takomiBlue' : 'bg-green-500/50');
      const textColor = state.header.active ? 'text-appText' : 'text-appMuted';
      document.getElementById('header-status').innerHTML = `
        <div class="w-1.5 h-1.5 rounded-full ${statusColor}"></div>
        <span class="text-[12px] opacity-80 ${textColor}">${state.header.statusText}</span>
      `;

      // Render Transcript
      const container = document.getElementById('transcript-container');
      container.innerHTML = '';

      state.transcript.forEach(turn => {
        if (turn.role === 'user') {
          // User Bubble
          const div = document.createElement('div');
          div.className = 'w-full flex flex-col gap-2 items-end';
          
          let attachmentsHtml = '';
          if (turn.attachments) {
            attachmentsHtml = `<div class="flex flex-wrap gap-2 w-full justify-end mb-1">`;
            turn.attachments.forEach(att => {
              if (att.type === 'image') {
                attachmentsHtml += `<div class="h-20 w-32 rounded-lg overflow-hidden border border-appBorder shrink-0 shadow-sm"><img src="${att.url}" class="w-full h-full object-cover"/></div>`;
              } else {
                attachmentsHtml += `<div class="flex items-center gap-2 bg-appItemBg border border-appBorder px-3 py-2 rounded-lg text-[13px] shadow-sm"><i data-lucide="${att.icon}" class="w-4 h-4 text-appMuted"></i><span>${att.name}</span><span class="text-appMuted text-[11px]">${att.size}</span></div>`;
              }
            });
            attachmentsHtml += `</div>`;
          }

          div.innerHTML = `
            ${attachmentsHtml}
            <div class="bg-appPanel border border-appBorder text-appText px-4 py-3 rounded-2xl rounded-tr-sm max-w-[85%] leading-relaxed shadow-sm">
              ${turn.content}
            </div>
          `;
          container.appendChild(div);
        } else if (turn.role === 'assistant') {
          // Assistant Thread
          const wrapper = document.createElement('div');
          wrapper.className = 'w-full flex gap-4';
          
          const icon = document.createElement('div');
          icon.className = 'w-8 h-8 rounded-full bg-takomiFocus/10 flex items-center justify-center shrink-0 mt-1 border border-takomiBlue/20 shadow-[0_0_15px_rgba(59,130,246,0.15)]';
          icon.innerHTML = `<i data-lucide="bot" class="w-4 h-4 text-takomiBlue"></i>`;
          
          const contentCol = document.createElement('div');
          contentCol.className = 'flex-1 flex flex-col gap-3 min-w-0';

          turn.parts.forEach(part => {
             if (part.type === 'text') {
               const p = document.createElement('div');
               p.className = 'markdown-content w-full';
               // Quick markdown processing
               let html = part.content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                            .replace(/`([^`]+)`/g, '<code>$1</code>')
                            .replace(/\n\n/g, '</p><p>')
                            .replace(/\n\d\.\s/g, '<br/>&bull; ');
               
               p.innerHTML = `<p>${html}${part.streaming ? '<span class="loading-dots font-bold"></span>' : ''}</p>`;
               contentCol.appendChild(p);
             } else if (part.type === 'thought') {
               const p = document.createElement('div');
               p.className = 'bg-appPanel border border-appBorder rounded-lg px-4 py-3 text-appMuted text-[13px] border-l-2 border-l-purple-500/50';
               p.innerHTML = `<div class="flex items-center gap-2 mb-1.5 font-medium text-appMuted text-xs"><i data-lucide="brain" class="w-3.5 h-3.5"></i> ${part.status === 'in_progress' ? 'Thinking<span class="loading-dots"></span>' : 'Thought Process'}</div>${part.text}`;
               contentCol.appendChild(p);
             } else if (part.type === 'command') {
               const p = document.createElement('div');
               const borderClass = part.status === 'failed' ? 'border-red-500/30' : 'border-appBorder';
               const iconClass = part.status === 'failed' ? 'text-red-400' : 'text-appMuted';
               
               let timeElapsedHtml = part.timeElapsed ? `<div class="ml-auto flex items-center gap-1.5 px-2 py-0.5 rounded bg-black/5 dark:bg-white/5 text-appMuted text-[10px]"><i data-lucide="clock" class="w-3 h-3"></i> worked for ${part.timeElapsed}</div>` : '';

               p.className = `w-full bg-appTerminalBg border ${borderClass} rounded-xl overflow-hidden shadow-sm`;
               p.innerHTML = `
                 <div class="px-3 py-2 border-b ${borderClass} bg-appTerminalHeader flex items-center justify-between">
                    <div class="flex items-center gap-2 font-mono text-[11px] ${iconClass}">
                      <i data-lucide="terminal" class="w-3.5 h-3.5"></i> 
                      <span>${part.command}</span>
                    </div>
                    ${part.status === 'in_progress' ? '<div class="w-2.5 h-2.5 rounded-full bg-orange-400/80 animate-pulse"></div>' : ''}
                 </div>
                 <div class="p-3 font-mono text-[11px] leading-relaxed text-appMuted whitespace-pre-wrap overflow-x-auto custom-scrollbar">${part.logs}</div>
                 ${timeElapsedHtml ? `<div class="px-3 pb-3">${timeElapsedHtml}</div>` : ''}
               `;
               contentCol.appendChild(p);
             } else if (part.type === 'file_change') {
               const p = document.createElement('div');
               p.className = 'flex flex-wrap gap-2 items-center';
               part.files.forEach(f => {
                  p.innerHTML += `<div class="flex items-center gap-1.5 bg-takomiFocus/10 border border-takomiFocus/20 text-takomiBlue px-2.5 py-1 rounded-[6px] text-[12px] mono truncate max-w-full"><i data-lucide="file-code" class="w-3 h-3"></i>${f}</div>`;
               });
               contentCol.appendChild(p);
             } else if (part.type === 'code') {
               const p = document.createElement('div');
               p.className = 'w-full bg-appTerminalBg border border-appBorder rounded-xl overflow-hidden shadow-sm';
               p.innerHTML = `
                 <div class="px-4 py-2 border-b border-appBorder bg-appTerminalHeader flex items-center justify-between text-[11px] text-appMuted uppercase font-medium">
                   <span>${part.language}</span>
                   <i data-lucide="copy" class="w-3.5 h-3.5 cursor-pointer hover:text-appText transition-colors"></i>
                 </div>
                 <div class="p-4 font-mono text-[12px] leading-relaxed text-appText whitespace-pre-wrap overflow-x-auto custom-scrollbar">${part.code}</div>
               `;
               contentCol.appendChild(p);
             } else if (part.type === 'pause_request') {
               const p = document.createElement('div');
               p.className = 'bg-orange-500/10 border border-orange-500/20 text-orange-200 px-4 py-3 rounded-lg flex items-start gap-3 mt-1';
               p.innerHTML = `<i data-lucide="pause-circle" class="w-5 h-5 shrink-0 mt-0.5 text-orange-400"></i><div class="flex-1 text-[13px] leading-relaxed font-medium">${part.text}</div>`;
               contentCol.appendChild(p);
             }
          });

          // Footer (Error/Completion indicators inside the assistant thread)
          if (turn.error) {
            const err = document.createElement('div');
            err.className = 'flex items-center gap-2 text-red-400 text-[12px] mt-2 font-medium';
            err.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4"></i> Run failed with errors.`;
            contentCol.appendChild(err);
          } else if (turn.cancelled) {
            const canc = document.createElement('div');
            canc.className = 'flex items-center gap-2 text-appMuted text-[12px] mt-2 font-medium';
            canc.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4"></i> Run cancelled by user.`;
            contentCol.appendChild(canc);
          }

          wrapper.appendChild(icon);
          wrapper.appendChild(contentCol);
          container.appendChild(wrapper);
        }
      });

      // Render Bottom Ticker
      const tickerContainer = document.getElementById('bottom-ticker-container');
      if (state.ticker) {
        tickerContainer.innerHTML = `<div class="flex items-center gap-2 bg-appBg/90 px-3 py-1 rounded-full border border-appBorder shadow-sm backdrop-blur"><div class="w-1.5 h-1.5 bg-appMuted/50 rounded-full animate-pulse"></div>${state.ticker}</div>`;
        tickerContainer.classList.remove('opacity-0', 'translate-y-2', 'hidden');
      } else {
        tickerContainer.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => { if (!state.ticker) tickerContainer.classList.add('hidden'); }, 300);
      }

      // Render Composer
      const input = document.getElementById('composer-input');
      input.value = state.composer.text;
      input.placeholder = state.composer.placeholder;
      input.disabled = state.composer.mode === 'stop';

      // Attachments in draft
      const attachRender = document.getElementById('composer-attachments');
      attachRender.innerHTML = '';
      if (state.attachments) {
        let html = '';
        state.attachments.forEach(att => {
          html += `<div class="flex items-center gap-1.5 bg-appItemBg border border-appBorder py-1 px-2 rounded-md text-[12px] shrink-0"><i data-lucide="${att.icon}" class="w-3.5 h-3.5 text-appMuted"></i><span>${att.name}</span><button class="ml-1 hover:text-appText"><i data-lucide="x" class="w-3 h-3 text-appMuted"></i></button></div>`;
        });
        attachRender.innerHTML = html;
        attachRender.classList.remove('hidden');
      } else {
        attachRender.classList.add('hidden');
      }

      const actions = document.getElementById('composer-actions');
      if (state.composer.mode === 'send') {
        const hasText = state.composer.text.length > 0 || (state.attachments && state.attachments.length > 0);
        const btnClass = hasText ? 'bg-takomiFocus text-white hover:bg-takomiBlue dark:bg-white dark:text-black dark:hover:bg-gray-200' : 'bg-black/10 text-black/30 dark:bg-white/10 dark:text-white/30 cursor-not-allowed';
        actions.innerHTML = `
          <button class="w-8 h-8 flex items-center justify-center rounded-lg transition-colors ${btnClass}">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        `;
      } else if (state.composer.mode === 'stop') {
        actions.innerHTML = `
          <button class="px-3 h-8 flex items-center gap-1.5 justify-center rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500/20 hover:text-red-400 border border-red-500/20 transition-colors font-medium text-xs">
            <i data-lucide="square" class="w-3 h-3 fill-current"></i> Stop
          </button>
        `;
      } else if (state.composer.mode === 'resume') {
        actions.innerHTML = `
          <button class="px-4 h-8 flex items-center gap-1.5 justify-center rounded-lg bg-orange-500 text-white hover:bg-orange-600 transition-colors font-medium text-xs shadow-lg shadow-orange-500/20">
            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Resume
          </button>
        `;
      }

      // Re-initialize icons and scroll
      lucide.createIcons();
      document.getElementById('transcript-scroll').scrollTop = document.getElementById('transcript-scroll').scrollHeight;
    }

    // Initialize sidebar list
    const stateList = document.getElementById('state-list');
    states.forEach(s => {
      const btn = document.createElement('button');
      btn.dataset.stateBtn = s.id;
      btn.className = 'w-full text-left px-3 py-2 rounded-md hover:bg-appHover transition-colors flex items-center justify-between group';
      btn.innerHTML = `
        <span class="truncate pr-2">${s.name}</span>
        <i data-lucide="chevron-right" class="w-3 h-3 opacity-0 group-hover:opacity-100 transition-opacity"></i>
      `;
      btn.onclick = () => renderState(s.id);
      stateList.appendChild(btn);
    });

    // Initial render
    renderState('idle');
  </script>
</body>
</html>
