  <style>
    :root {
      --app-bg: #FFFFFF;
      --app-panel: #F4F4F5;
      --app-border: #E4E4E7;
      --app-hover: #F4F4F5;
      --app-text: #09090B;
      --app-muted: #71717A;
      --app-item-bg: #F4F4F5;
      --app-terminal-bg: #F8F8F8;
      --app-terminal-header: #E4E4E7;
    }
    
    .dark {
      --app-bg: #111111;
      --app-panel: #161616;
      --app-border: #27272A;
      --app-hover: #1F1F22;
      --app-text: #E5E5E5;
      --app-muted: #9CA3AF;
      --app-item-bg: #1A1A1C;
      --app-terminal-bg: #0C0C0D;
      --app-terminal-header: #151516;
    }
    
    body { font-family: 'Inter', sans-serif; background-color: var(--app-bg); color: var(--app-text); transition: background-color 0.3s, color 0.3s; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #444444; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #555555; }
    
    *:focus-visible {
      outline-offset: 0 !important;
      --ring-offset: 0 !important;
      outline: none !important;
    }

    .markdown-content p { margin-bottom: 0.75rem; line-height: 1.6; }
    .markdown-content p:last-child { margin-bottom: 0; }
    .markdown-content code:not(pre code) { 
      background: var(--app-item-bg); 
      padding: 0.125rem 0.375rem; 
      border-radius: 0.25rem; 
      font-family: 'JetBrains Mono', monospace; 
      font-size: 0.85em; 
    }
    .markdown-content a { color: var(--takomiBlue); text-decoration: none; }
    .markdown-content a:hover { text-decoration: underline; }
    .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
    
    .loading-dots:after {
      content: '.';
      animation: dots 1.5s steps(5, end) infinite;
    }
    @keyframes dots {
      0%, 20% { color: transparent; text-shadow: .25em 0 0 transparent, .5em 0 0 transparent;}
      40% { color: inherit; text-shadow: .25em 0 0 transparent, .5em 0 0 transparent;}
      60% { text-shadow: .25em 0 0 inherit, .5em 0 0 transparent;}
      80%, 100% { text-shadow: .25em 0 0 inherit, .5em 0 0 inherit;}
    }

    [data-state-btn].active {
      background-color: var(--app-border);
      color: var(--app-text);
    }
  </style>
</head>

    function applyToggleState(btnId, labelId, activeColorClass, iconColorClass, isActive) {
       const btn = document.getElementById(btnId);
       const lbl = document.getElementById(labelId);
       // Reset classes
       btn.className = 'rounded-full transition-all duration-300 ease-spring flex items-center gap-1 px-2 py-1 border h-8 font-medium hover:scale-105 active:scale-95';
       lbl.className = 'text-xs overflow-hidden flex-shrink-0 transition-all duration-300 ease-spring';
       
       if (isActive) {
          btn.classList.add('bg-black/5', 'dark:bg-white/[0.05]', 'border-'+activeColorClass.split('-')[1], activeColorClass); // Example active state look
          const icon = btn.querySelector('i');
          icon.className = `w-4 h-4 ${activeColorClass} fill-current transition-transform duration-300 ease-spring hover:rotate-12 hover:scale-110`;
          lbl.classList.remove('hidden', 'w-0', 'opacity-0');
          lbl.classList.add('w-auto', 'opacity-100', 'ml-0.5');
       } else {
          btn.classList.add('bg-transparent', 'border-transparent', 'text-appMuted', 'hover:text-takomiFocus', 'dark:hover:text-[#D1D5DB]');
          const icon = btn.querySelector('i');
          icon.className = `w-4 h-4 text-inherit transition-transform duration-300 ease-spring hover:rotate-12 hover:scale-110 group-hover:block`;
          lbl.classList.add('hidden', 'w-0', 'opacity-0');
       }
    }

    function renderState(stateId) {
      const state = states.find(s => s.id === stateId);
      if (!state) return;

      // Update sidebar active state
      document.querySelectorAll('[data-state-btn]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.stateBtn === stateId);
      });

      // Render Header Status 
      const buildSpinner = document.getElementById('build-spinner');
      if (state.header.active) buildSpinner.classList.remove('hidden');
      else buildSpinner.classList.add('hidden');
      
      const statusColor = state.header.paused ? 'bg-orange-500' : (state.header.active ? 'bg-takomiBlue' : 'bg-transparent hidden');
      document.getElementById('header-status').innerHTML = `<div class="w-1.5 h-1.5 rounded-full ${statusColor}"></div>`;

      // Render Transcript (Daily style inherited from v2)
      const container = document.getElementById('transcript-container');
      container.innerHTML = '';

      state.transcript.forEach(turn => {
        if (turn.role === 'user') {
          // User Bubble 
          const div = document.createElement('div');
          div.className = 'w-full flex flex-col items-end pt-4'; 
          
          let attachmentsHtml = '';
          if (turn.attachments) {
            attachmentsHtml = `<div class="flex flex-wrap gap-2 w-full justify-end mb-2">`;
            turn.attachments.forEach(att => {
              if (att.type === 'image') {
                attachmentsHtml += `<div class="h-28 w-44 rounded-xl overflow-hidden border border-black/10 dark:border-white/5 shrink-0 shadow-md transition-all duration-300 hover:scale-105 hover:-translate-y-1 ease-spring cursor-pointer"><img src="${att.url}" class="w-full h-full object-cover"/></div>`;
              } else {
                attachmentsHtml += `<div class="flex items-center gap-2 bg-appItemBg border border-appBorder px-3 py-2 rounded-lg text-[13px] shadow-sm transition-all duration-300 hover:scale-105 hover:-translate-y-1 ease-spring cursor-pointer"><i data-lucide="${att.icon}" class="w-4 h-4 text-appMuted"></i><span class="text-appText">${att.name}</span><span class="text-appMuted text-[11px]">${att.size}</span></div>`;
              }
            });
            attachmentsHtml += `</div>`;
          }

          div.innerHTML = `
            ${attachmentsHtml}
            <div class="bg-[#F8F8F8] dark:bg-[#1D1D20] text-appText px-5 py-4 rounded-3xl max-w-[85%] leading-relaxed shadow-[0_2px_10px_rgba(0,0,0,0.02)] border border-black/5 dark:border-none whitespace-pre-wrap font-medium transition-colors">
              ${turn.content}
            </div>
          `;
          container.appendChild(div);
        } else if (turn.role === 'assistant') {
          // Assistant Thread
          const wrapper = document.createElement('div');
          wrapper.className = 'w-full flex flex-col gap-4 mt-4';
          
          turn.parts.forEach(part => {
             if (part.type === 'time_elapsed_divider') {
               const p = document.createElement('div');
               p.className = 'w-full flex items-center gap-4 text-xs text-appMuted py-4';
               p.innerHTML = `<div class="h-px bg-white/5 flex-1"></div><span>${part.text} <i data-lucide="chevron-right" class="w-3 h-3 inline"></i></span><div class="h-px bg-white/5 flex-1"></div>`;
               wrapper.appendChild(p);
             } else if (part.type === 'text') {
               const p = document.createElement('div');
               p.className = 'markdown-content w-full';
               if(part.content.includes('<ul>')) {
                  p.innerHTML = `<div class="text-[14px] leading-relaxed text-appText">${part.content}${part.streaming ? '<span class="loading-dots font-bold"></span>' : ''}</div>`;
               } else {
                 let html = part.content
                              .replace(/\nH/g, '<br/>H')
                              .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                              .replace(/`([^`]+)`/g, '<code>$1</code>')
                              .replace(/\n\n/g, '</p><p>');
                 p.innerHTML = `<p class="text-[14px] leading-relaxed text-appText">${html}${part.streaming ? '<span class="loading-dots font-bold"></span>' : ''}</p>`;
               }
               wrapper.appendChild(p);
             } else if (part.type === 'thought') {
               const p = document.createElement('div');
               p.className = 'bg-appPanel border border-appBorder rounded-lg px-4 py-3 text-appMuted text-[13px] border-l-2 border-l-[#8B5CF6]/70 max-w-2xl';
               p.innerHTML = `<div class="flex items-center gap-2 mb-1.5 font-medium text-appMuted text-xs"><i data-lucide="brain-cog" class="w-3.5 h-3.5 text-[#8B5CF6]"></i> ${part.status === 'in_progress' ? 'Thinking<span class="loading-dots"></span>' : 'Thought Process'}</div>${part.text}`;
               wrapper.appendChild(p);
             } else if (part.type === 'command') {
               const p = document.createElement('div');
               const borderClass = part.status === 'failed' ? 'border-red-500/30' : 'border-appBorder/50';
               const iconClass = part.status === 'failed' ? 'text-red-400' : 'text-appMuted';
               let timeElapsedHtml = part.timeElapsed ? `<div class="ml-auto text-appMuted text-[10px] mt-1 text-right">worked for ${part.timeElapsed}</div>` : '';
               p.className = `w-full max-w-3xl bg-[var(--app-terminal-bg)] border ${borderClass} rounded-xl overflow-hidden shadow-sm transition-all duration-300 ease-spring hover:-translate-y-1 hover:shadow-md`;
               p.innerHTML = `
                 <div class="px-4 py-3 flex flex-col text-[12px]">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center gap-2 font-mono ${iconClass}">
                        <span class="text-appMuted font-bold">>_</span>
                        <span>${part.command}</span>
                      </div>
                      ${part.status === 'in_progress' ? '<div class="w-2.5 h-2.5 rounded-full bg-orange-400/80 animate-pulse"></div>' : ''}
                    </div>
                    ${part.logs ? `<div class="font-mono text-[11px] leading-relaxed text-appMuted whitespace-pre-wrap overflow-x-auto custom-scrollbar mt-2 p-2 bg-black/20 rounded">${part.logs}</div>` : ''}
                    ${timeElapsedHtml}
                 </div>
               `;
               wrapper.appendChild(p);
             } else if (part.type === 'file_diff_card') {
               const p = document.createElement('div');
               p.className = 'w-full max-w-3xl bg-[var(--app-item-bg)] border border-appBorder/50 rounded-xl overflow-hidden shadow-sm mt-2 mb-2 transition-all duration-300 ease-spring hover:-translate-y-1 hover:shadow-md hover:border-takomiFocus/30 cursor-default';
               let filesHtml = part.files.map(f => `
                  <div class="flex items-center justify-between py-2 border-t border-white/5 opacity-80 hover:opacity-100 transition-opacity">
                    <span class="text-appText truncate font-mono text-[12px]"><a href="#" class="no-underline text-takomiBlue hover:underline">${f.path}</a></span>
                    <span class="text-green-500 shrink-0 font-mono text-[11px] ml-4">+${f.add} <span class="text-red-500 ml-1">-${f.del}</span></span>
                  </div>
               `).join('');
               p.innerHTML = `
                 <div class="px-4 py-3">
                   <div class="flex items-center justify-between mb-2 text-[13px]">
                     <span class="font-semibold text-appText">${part.count} files changed <span class="text-green-500 ml-1">+${part.add}</span> <span class="text-red-500 ml-1">-${part.del}</span></span>
                     <button class="flex items-center gap-1.5 text-appMuted hover:text-white transition-colors bg-white/5 px-2 py-1 rounded"><i data-lucide="corner-up-left" class="w-3.5 h-3.5"></i> Undo</button>
                   </div>
                   <div class="flex flex-col mt-2 pr-2">
                     ${filesHtml}
                   </div>
                 </div>
               `;
               wrapper.appendChild(p);
             } else if (part.type === 'pause_request') {
               const p = document.createElement('div');
               p.className = 'bg-orange-500/10 border border-orange-500/20 text-orange-200 px-4 py-3 rounded-lg flex items-start gap-3 mt-1 max-w-2xl';
               p.innerHTML = `<i data-lucide="pause-circle" class="w-5 h-5 shrink-0 mt-0.5 text-orange-400"></i><div class="flex-1 text-[13px] leading-relaxed font-medium">${part.text}</div>`;
               wrapper.appendChild(p);
             }
          });

          if (turn.error) {
            const err = document.createElement('div');
            err.className = 'flex items-center gap-2 text-red-400 text-[12px] mt-2 font-medium';
            err.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4"></i> Run failed with errors.`;
            wrapper.appendChild(err);
          } else if (turn.cancelled) {
            const canc = document.createElement('div');
            canc.className = 'flex items-center gap-2 text-appMuted text-[12px] mt-2 font-medium';
            canc.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4"></i> Run cancelled by user.`;
            wrapper.appendChild(canc);
          }
          container.appendChild(wrapper);
        }
      });

      // Render Bottom Ticker
      const tickerContainer = document.getElementById('bottom-ticker-container');
      if (state.ticker) {
        tickerContainer.innerHTML = `<div class="flex items-center gap-2 bg-appBg/90 px-3 py-1 rounded-full border border-appBorder shadow-sm backdrop-blur"><div class="w-1.5 h-1.5 bg-appMuted/50 rounded-full animate-pulse"></div>${state.ticker}</div>`;
        tickerContainer.classList.remove('opacity-0', 'translate-y-2', 'hidden');
      } else {
        tickerContainer.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => { if (!state.ticker) tickerContainer.classList.add('hidden'); }, 300);
      }

      // Render Composer
      const input = document.getElementById('composer-input');
      input.value = state.composer.text;
      input.placeholder = state.composer.placeholder;
      input.disabled = state.composer.mode === 'stop';
      
      // Composer Toggles
      const isThink = state.composer.toggles && state.composer.toggles.think;
      const isSearch = state.composer.toggles && state.composer.toggles.search;
      const isCanvas = state.composer.toggles && state.composer.toggles.canvas;
      applyToggleState('toggle-search', 'label-search', 'text-[#1EAEDB]', 'border-[#1EAEDB]', isSearch);
      applyToggleState('toggle-think', 'label-think', 'text-[#8B5CF6]', 'border-[#8B5CF6]', isThink);
      applyToggleState('toggle-canvas', 'label-canvas', 'text-[#F97316]', 'border-[#F97316]', isCanvas);

      // Attachments in draft
      const attachRender = document.getElementById('composer-attachments');
      attachRender.innerHTML = '';
      if (state.attachments) {
        let html = '';
        state.attachments.forEach(att => {
          html += `<div class="flex items-center gap-1.5 bg-black/5 dark:bg-[#2A2B2F] border border-black/10 dark:border-[#444444] py-1 px-2 rounded-lg text-[12px] shrink-0 text-appText transition-all duration-300 ease-spring hover:scale-105"><i data-lucide="${att.icon}" class="w-3.5 h-3.5 text-appMuted"></i><span>${att.name}</span><button class="ml-1 hover:text-red-500 transition-colors"><i data-lucide="x" class="w-3.5 h-3.5 text-appMuted hover:text-red-500"></i></button></div>`;
        });
        attachRender.innerHTML = html;
        attachRender.classList.remove('hidden');
      } else {
        attachRender.classList.add('hidden');
      }

      // Composer Actions
      const actions = document.getElementById('composer-actions');
      if (state.composer.mode === 'send') {
        const hasText = state.composer.text.length > 0 || (state.attachments && state.attachments.length > 0);
        
        let micClass = "flex h-8 w-8 text-appMuted cursor-pointer items-center justify-center rounded-full transition-all duration-300 ease-spring hover:bg-black/5 dark:hover:bg-white/10 hover:text-takomiFocus dark:hover:text-white hover:scale-110 active:scale-95";
        
        if (hasText) {
          actions.innerHTML = `
            <button class="h-8 w-8 rounded-full transition-all duration-300 ease-spring bg-black hover:bg-black/80 dark:bg-white dark:hover:bg-white/80 text-white dark:text-[#1F2023] flex items-center justify-center hover:scale-110 active:scale-95 shadow-md">
              <i data-lucide="arrow-up" class="h-4 w-4"></i>
            </button>
          `;
        } else {
          actions.innerHTML = `
            <button class="${micClass}">
              <i data-lucide="mic" class="h-5 w-5"></i>
            </button>
          `;
        }
      } else if (state.composer.mode === 'stop') {
        actions.innerHTML = `
          <button class="h-8 w-8 rounded-full transition-all duration-300 ease-spring bg-transparent hover:bg-black/5 dark:hover:bg-white/10 flex items-center justify-center group hover:scale-110 active:scale-95">
             <i data-lucide="square" class="h-4 w-4 fill-transparent stroke-appMuted group-hover:stroke-takomiFocus dark:group-hover:stroke-white dark:group-hover:fill-white transition-colors duration-300"></i>
          </button>
        `;
      } else if (state.composer.mode === 'resume') {
        actions.innerHTML = `
          <button class="px-5 h-8 flex items-center gap-1.5 justify-center rounded-full transition-all duration-300 ease-spring bg-black dark:bg-white text-white dark:text-[#1F2023] hover:scale-105 active:scale-95 shadow-md font-semibold text-xs transition-colors">
            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Resume
          </button>
        `;
      }

      lucide.createIcons();
      document.getElementById('transcript-scroll').scrollTop = document.getElementById('transcript-scroll').scrollHeight;
    }

    // Initialize sidebar list
    const stateList = document.getElementById('state-list');
    states.forEach(s => {
      const btn = document.createElement('button');
      btn.dataset.stateBtn = s.id;
      btn.className = 'w-full text-left px-3 py-2 rounded-md hover:bg-appHover transition-colors flex items-center justify-between group';
      btn.innerHTML = `
        <span class="truncate pr-2">${s.name}</span>
        <i data-lucide="chevron-right" class="w-3 h-3 opacity-0 group-hover:opacity-100 transition-opacity"></i>
      `;
      btn.onclick = () => renderState(s.id);
      stateList.appendChild(btn);
    });

    renderState('idle');
  </script>
</body>
</html>
